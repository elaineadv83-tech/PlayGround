<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Neon Drift</title>
  <style>
    :html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#050711; }
    body { font-family:Inter,system-ui,sans-serif; touch-action:none; }
    canvas { display:block; width:100%; height:100%; }
    #hud { position:fixed; inset:0; pointer-events:none; color:white; }
    .top { position:absolute; top:max(18px,env(safe-area-inset-top)); left:24px; right:24px; display:flex; justify-content:space-between; align-items:flex-start; }
    .brand { text-transform:uppercase; letter-spacing:.22em; font-weight:900; font-size:14px; text-shadow:0 0 14px #ff2bd6; }
    .stats { text-align:right; font-weight:800; }
    #score { font-size:32px; line-height:1; }
    #combo { color:#66e6ff; font-size:12px; letter-spacing:.16em; margin-top:8px; }
    #speed { position:absolute; left:24px; bottom:max(24px,env(safe-area-inset-bottom)); font-size:13px; letter-spacing:.12em; color:#a9b1d1; }
    #speed b { color:white; font-size:28px; letter-spacing:0; }
    #overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,rgba(5,7,17,.35),rgba(5,7,17,.82)); color:white; text-align:center; z-index:5; }
    #panel { width:min(420px,calc(100% - 40px)); }
    h1 { margin:0 0 8px; font-size:clamp(48px,10vw,82px); line-height:.86; letter-spacing:-.08em; text-transform:uppercase; font-style:italic; text-shadow:5px 5px 0 #ff2bd6, -3px -3px 0 #41dcff; }
    #subtitle { margin:18px 0 28px; color:#c8cee8; line-height:1.5; }
    button { pointer-events:auto; border:1px solid #69efff; border-radius:999px; background:#68e7ff; color:#07101d; min-height:54px; padding:0 34px; font-weight:900; letter-spacing:.12em; text-transform:uppercase; box-shadow:0 0 30px rgba(104,231,255,.35); cursor:pointer; }
    #controls { position:absolute; right:24px; bottom:max(24px,env(safe-area-inset-bottom)); display:flex; gap:10px; pointer-events:auto; }
    .key { width:58px; height:58px; border:1px solid rgba(255,255,255,.18); border-radius:18px; background:rgba(8,12,28,.65); backdrop-filter:blur(8px); color:white; font-size:20px; box-shadow:inset 0 0 18px rgba(100,220,255,.06); touch-action:none; }
    .key:active { background:#69efff; color:#07101d; }
    @media (pointer:fine) { #controls { display:none; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="top"><div class="brand">Neon<br>Drift</div><div class="stats"><div id="score">00000</div><div id="combo">COMBO ×1</div></div></div>
    <div id="speed"><b id="speednum">180</b> KM/H</div>
    <div id="controls"><button class="key" id="left" aria-label="Left">←</button><button class="key" id="right" aria-label="Right">→</button></div>
  </div>
  <div id="overlay">
    <div id="panel"><h1 id="title">Neon<br>Drift</h1><div id="subtitle">Thread the midnight highway.<br>Collect sparks. Dodge the sentries.</div><button id="start">Start run</button></div>
  </div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W,H,DPR=1,lanes,player,traffic=[],sparks=[],particles=[],stars=[],roadOffset=0,score=0,speed=180,last=0,alive=false,combo=1,spawnTimer=0,sparkTimer=0,shake=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);lanes=roadGeometries();stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,a:Math.random()}));}
function roadGeometries(){const horizon=H*.28,bottom=W*.72,top=W*.13;return {horizon,bottom,top,cx:W/2};}
function roadX(lane,y){const t=Math.max(0,Math.min(1,(y-lanes.horizon)/(H-lanes.horizon));return lanes.cx+(lane-1)*(lanes.top+(lanes.bottom-lanes.top)*t)/3}
function roadWidth(y){const t=Math.max(0,Math.min(1,(y-lanes.horizon)/(H-lanes.horizon)));return lanes.top+(lanes.bottom-lanes.top)*t}
function reset(){lanes=roadGeometries();player={lane:0,x:lanes.cx,y:H*.78,vx:0};traffic=[];sparks=[];particles=[];score=0;combo=1;speed=180;spawnTimer=.6;sparkTimer=.5;roadOffset=0;alive=true;document.getElementById('overlay').style.display='none';}
function project(y, offset=0){const t=(y-lanes.horizon)/(H-lanes.horizon);const half=roadWidth(y)/2;return {x:lanes.cx+offset*(half/2),half,t};}
const keys={left:false,right:false};
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;});
for(const [id,key] of [['left','left'],['right','right']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventPointer?e.preventDefault():null;e.preventDefault();keys[key]=true});el.addEventListener('pointerup',()=>keys[key]=false);el.addEventListener('pointercancel',()=>keys[key]=false);}
document.getElementById('start').onclick=reset;
function laneTargets(){if(keys.left&&!keys.right)player.lane=Math.max(-1,player.lane-.018);if(keys.right&&!keys.left)player.lane=Math.min(1,player.lane+.018);}
function update(dt){if(!alive)return;laneTargets();player.vx+=(keys.left?-1:keys.right?1:0)*dt*2.8-player.vx*dt*5;player.lane=Math.max(-1.05,Math.min(1.05,player.lane+player.vx*dt));roadOffset=(roadOffset+speed*dt*.012)%1;speed=Math.min(260,180+score*.002);spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=Math.max(.38,1.05-Math.min(score/7000,.5))*(.75+Math.random*.5);const lane=(Math.floor(Math.random()*3)-1);traffic.push({lane,y:lanes.horizon+8,z:.08,phase:Math.random()*6.28,w:.7+Math.random*.45});}
sparkTimer-=dt;if(sparkTimer<=0){sparkTimer=.55+Math.random*.75;sparks.push({lane:(Math.floor(Math.random()*3)-1),y:lanes.horizon,z:.08,phase:Math.random()});}
for(const o of traffic){o.z+=dt*(.09+speed/260*.09);o.y=lanes.horizon+(H-lanes.horizon)*o.z;if(Math.abs(o.z-.78)<.018&&Math.abs(o.lane-player.lane)<.24)crash();}
for(const s of sparks){s.z+=dt*(.09+speed/260*.09);s.y=lanes.horizon+(H-lanes.horizon)*s.z;if(Math.abs(s.z-.78)<.026&&Math.abs(s.lane-player.lane)<.23){score+=250*combo;combo=Math.min(9,combo+1);s.dead=true;burst(roadX(s.lane,s.y),s.y,'#74f7ff',12);}}
traffic=traffic.filter(o=>o.z<1.12&&!o.dead);sparks=sparks.filter(s=>s.z<1.12&&!s.dead);score+=dt*speed*.18;combo=combo>1?Math.max(1,combo-dt*.08):combo;for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=220*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);shake*=.88;document.getElementById('score').textContent=Math.floor(score).toString().padStart(5,'0');document.getElementById('speednum').textContent=Math.floor(speed);document.getElementById('combo').textContent='COMBO ×'+combo.toFixed(0);}
function crash(){alive=false;shake=12;burst(roadX(player.lane,H*.78),H*.78,'#ff3cb4',35);setTimeout(()=>{const o=document.getElementById('overlay');document.getElementById('title').innerHTML='Run<br>Ended';document.getElementById('subtitle').innerHTML='Score '+Math.floor(score).toLocaleString()+'<br>Best: '+Math.max(score,+(localStorage.neonBest||0)).toLocaleString();document.getElementById('start').textContent='Race again';o.style.display='flex';localStorage.neonBest=Math.max(score,+(localStorage.neonBest||0));},350)}
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*220+40;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:Math.random()*0.7+0.35,color,size:Math.random()*3+1});}}
function draw(){ctx.save();if(shake>1)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#080817');grad.addColorStop(.55,'#090718');grad.addColorStop(1,'#02030a');ctx.fillStyle=grad;ctx.fillRect(-20,-20,W+40,H+40);
for(const s of stars){s.a+=.01;ctx.globalAlpha=.25+Math.sin(s.a)*.2;ctx.fillStyle='#b7c8ff';ctx.fillRect(s.x,s.y,s.r,s.r);}ctx.globalAlpha=1;
const horizon=lanes.horizon;ctx.fillStyle='#111330';ctx.beginPath();ctx.moveTo(0,horizon);for(let x=0;x<=W;x+=20){ctx.lineTo(x,horizon-18-Math.sin(x*.012)*12-Math.sin(x*.037)*7)}ctx.lineTo(W,H*.42);ctx.lineTo(0,H*.42);ctx.fill();ctx.fillStyle='#ff2bd6';ctx.fillRect(0,horizon,W,2);
ctx.save();ctx.beginPath();ctx.moveTo(lanes.cx-roadWidth(horizon)/2,horizon);ctx.lineTo(lanes.cx-roadWidth(H)/2,H);ctx.lineTo(lanes.cx+roadWidth(H)/2,H);ctx.lineTo(lanes.cx+roadWidth(horizon)/2,horizon);ctx.closePath();ctx.clip();const rg=ctx.createLinearGradient(0,horizon,0,H);rg.addColorStop(0,'#15152c');rg.addColorStop(1,'#090b1a');ctx.fillStyle=rg;ctx.fillRect(0,horizon,W,H-horizon);
for(let i=-8;i<12;i++){const y=((i*.11+roadOffset)%1)*H;if(y<horizon)continue;const t=(y-horizon)/(H-horizon);ctx.globalAlpha=.25+t*.5;ctx.strokeStyle='#70edff';ctx.lineWidth=1+t*3;ctx.beginPath();ctx.moveTo(lanes.cx-roadWidth(y)/2,y);ctx.lineTo(lanes.cx+roadWidth(y)/2,y);ctx.stroke();}
ctx.globalAlpha=1;for(let lane=-1;lane<=1;lane++){ctx.beginPath();for(let i=0;i<=30;i++){const y=horizon+(H-horizon)*i/30,t=i/30,x=lanes.cx+(lane+.5)*(lanes.top+(lanes.bottom-lanes.top)*t)/3;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.strokeStyle='rgba(121,230,255,.28)';ctx.lineWidth=2;ctx.stroke();}ctx.restore();
const objects=[...traffic.map(o=>({...o,type:'car'})),...sparks.map(s=>({...s,type:'spark'}))].sort((a,b)=>a.z-b.z);
for(const o of objects){const x=roadX(o.lane,o.y),scale=.25+o.z*1.1;if(o.type==='spark'){ctx.save();ctx.translate(x,o.y);ctx.rotate(performance.now*.003+o.phase);ctx.shadowBlur=20;ctx.shadowColor='#78f5ff';ctx.fillStyle='#bdfcff';ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?3*scale:8*scale,a=i*Math.PI/4;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}else{const w=48*scale,h=78*scale;ctx.save();ctx.translate(x,o.y);ctx.shadowBlur=18*scale;ctx.shadowColor='#ff2aaf';ctx.fillStyle='#b50f78';ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,8*scale);ctx.fill();ctx.fillStyle='#ff52c7';ctx.fillRect(-w*.34,-h*.32,w*.68,h*.12);ctx.fillStyle='#9ff4ff';ctx.fillRect(-w*.32,h*.28,w*.22,h*.12);ctx.fillRect(w*.1,h*.28,w*.22,h*.12);ctx.restore();}}
const py=H*.78,px=roadX(player.lane,py),scale=Math.max(.75,Math.min(1.15,W/900));ctx.save();ctx.translate(px,py);ctx.rotate(player.vx*.12);ctx.shadowBlur=25;ctx.shadowColor='#65dfff';ctx.fillStyle='#70e9ff';ctx.beginPath();ctx.roundRect(-30*scale,-48*scale,60*scale,96*scale,12*scale);ctx.fill();ctx.fillStyle='#10162b';ctx.beginPath();ctx.moveTo(-22*scale,-28*scale);ctx.lineTo(-14*scale,-42*scale);ctx.lineTo(14*scale,-42*scale);ctx.lineTo(22*scale,-28*scale);ctx.closePath();ctx.fill();ctx.fillStyle='#ff2bd6';ctx.fillRect(-24*scale,28*scale,48*scale,8*scale);ctx.fillStyle='#fff';ctx.fillRect(-20*scale,39*scale,10*scale,5*scale);ctx.fillRect(10*scale,39*scale,10*scale,5*scale);ctx.restore();
for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color||'#ff4bc8';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.restore();}
function loop(now){const dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
resize();addEventListener('resize',resize);requestAnimationFrame(loop);
</script>
</body>
</html>
